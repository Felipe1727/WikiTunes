name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificar:
    name: Lint y pruebas (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
      # En la CI las pruebas de integración nunca se saltan.
      WIKITUNES_EXIGIR_BD: "1"
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6

      - name: Instalar dependencias
        run: uv sync

      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .

      - name: Levantar la base de datos
        run: docker compose up -d --wait

      - name: Pruebas
        run: uv run pytest -rs

      - name: Registros de la base si algo falla
        if: failure()
        run: docker compose logs bd
