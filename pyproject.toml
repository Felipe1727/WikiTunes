[project]
name = "wikitunes"
version = "0.1.0"
description = "CLI estética para consultar un catálogo musical guardado en MySQL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mysql-connector-python>=9.1",
    "pyfiglet>=1.0",
    "python-dotenv>=1.0",
    "questionary>=2.0",
    "rich>=13.7",
]

[project.scripts]
wikitunes = "wikitunes.cli:ejecutar"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wikitunes"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integracion: pruebas que necesitan la base de datos MySQL levantada",
]
